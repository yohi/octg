name: Deploy Deno Tokenizer

on:
  push:
    branches: [master]
    paths:
      - apps/deno-tokenizer/**
      - packages/shared/**
      - .github/workflows/deploy-deno-tokenizer.yml
  pull_request:
    branches: [master]
    paths:
      - apps/deno-tokenizer/**
      - packages/shared/**
      - .github/workflows/deploy-deno-tokenizer.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate Deno tokenizer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/deno-tokenizer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
          cache: true

      - name: Typecheck
        run: deno task check

      - name: Unit tests
        run: deno task test

  deploy:
    name: Deploy to Deno Deploy
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deno-production
    concurrency:
      group: deno-tokenizer-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DENO_DEPLOY_ORG: ${{ vars.DENO_DEPLOY_ORG }}
      DENO_DEPLOY_APP: ${{ vars.DENO_DEPLOY_APP }}
      DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
          cache: true

      - name: Verify deployment configuration
        run: |
          if [[ -z "$DENO_DEPLOY_ORG" || -z "$DENO_DEPLOY_APP" ]]; then
            echo "::error::DENO_DEPLOY_ORG and DENO_DEPLOY_APP must be configured"
            exit 2
          fi
          if [[ -z "$DENO_DEPLOY_TOKEN" ]]; then
            echo "::error::DENO_DEPLOY_TOKEN is not configured"
            exit 2
          fi

      - name: Deploy
        working-directory: apps/deno-tokenizer
        run: |
          deno deploy . \
            --org "$DENO_DEPLOY_ORG" \
            --app "$DENO_DEPLOY_APP" \
            --prod \
            --json \
            --non-interactive
