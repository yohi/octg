name: Deploy Deno Tokenizer

on:
  push:
    branches: [master]
    paths:
      - deno.json
      - apps/deno-tokenizer/**
      - packages/shared/**
      - scripts/deno-deploy-failure-diagnostics.mjs
      - .github/workflows/deploy-deno-tokenizer.yml
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - deno.json
      - apps/deno-tokenizer/**
      - packages/shared/**
      - scripts/deno-deploy-failure-diagnostics.mjs
      - .github/workflows/deploy-deno-tokenizer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Deno tokenizer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/deno-tokenizer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
          cache: true

      - name: Install Deno dependencies
        run: deno install --node-modules-dir=auto

      - name: Typecheck
        run: deno task check

      - name: Unit tests
        run: deno task test

  deploy:
    name: Deploy to Deno Deploy
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'deploy-deno' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deno-production
    concurrency:
      group: deno-tokenizer-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DENO_DEPLOY_ORG: ${{ vars.DENO_DEPLOY_ORG }}
      DENO_DEPLOY_APP: ${{ vars.DENO_DEPLOY_APP }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.6
          cache: true

      - name: Install Deno dependencies
        working-directory: apps/deno-tokenizer
        run: deno install --node-modules-dir=auto

      - name: Verify deployment configuration
        run: |
          if [[ -z "$DENO_DEPLOY_ORG" || -z "$DENO_DEPLOY_APP" ]]; then
            echo "::error::DENO_DEPLOY_ORG and DENO_DEPLOY_APP must be configured"
            exit 2
          fi
      - name: Prepare Deno Deploy configuration
        working-directory: .
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "deno.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          if (!config.deploy || typeof config.deploy !== "object") {
            throw new Error("deno.json must contain a deploy configuration");
          }
          const org = process.env.DENO_DEPLOY_ORG;
          const app = process.env.DENO_DEPLOY_APP;
          if (!org || !app) {
            throw new Error("DENO_DEPLOY_ORG and DENO_DEPLOY_APP must be configured");
          }
          config.deploy.org = org;
          config.deploy.app = app;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - name: Deploy
        id: deploy
        working-directory: .
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: |
          if [[ -z "$DENO_DEPLOY_TOKEN" ]]; then
            echo "::error::DENO_DEPLOY_TOKEN is not configured"
            exit 2
          fi
          set +e
          # Deno 2.9.6 duplicates passthrough arguments in its deploy wrapper.
          deno run -A jsr:@deno/deploy@0.0.9904 \
            --prod \
            --json \
            --non-interactive >"$RUNNER_TEMP/deno-deploy.log" 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            if ! node scripts/deno-deploy-failure-diagnostics.mjs extract "$RUNNER_TEMP/deno-deploy.log"; then
              echo "::warning::Deno Deploy failure diagnostics could not extract a revision ID"
            fi
            echo "::error::Deno Deploy failed; raw CLI output was suppressed"
          fi
          exit "$status"

      - name: Classify failed revision
        if: failure() && steps.deploy.outputs.revision != ''
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_DEPLOY_REVISION: ${{ steps.deploy.outputs.revision }}
        run: |
          node scripts/deno-deploy-failure-diagnostics.mjs classify
          set +e
          deno run -A jsr:@deno/deploy@0.0.9904 \
            logs \
            --org "$DENO_DEPLOY_ORG" \
            --app "$DENO_DEPLOY_APP" \
            --once \
            --json \
            --non-interactive \
            2>/dev/null \
            | node scripts/deno-deploy-failure-diagnostics.mjs classify-runtime "$DENO_DEPLOY_REVISION"
          logs_status="${PIPESTATUS[0]}"
          set -e
          if [[ "$logs_status" -ne 0 ]]; then
            echo "::warning::Deno Deploy runtime-log diagnostics unavailable"
          fi
