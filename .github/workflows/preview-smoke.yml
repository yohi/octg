name: Preview Smoke Test

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: octg-deployment
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
          cache: true

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Smoke script contract test
        run: npm run test:ci-smoke

      - name: Preview workflow contract test
        run: npm run test:preview-workflow

  version-smoke:
    needs: test
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    permissions:
      contents: read
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare isolated preview config
        id: preview-config
        env:
          PREVIEW_DATABASE_ID: ${{ vars.OCTG_PREVIEW_DATABASE_ID }}
          PREVIEW_BASE_URL: ${{ vars.OCTG_PREVIEW_BASE_URL }}
          PREVIEW_UPSTREAM_BASE_URL: ${{ vars.OCTG_PREVIEW_UPSTREAM_BASE_URL }}
          PREVIEW_QUOTA_LIMIT_STANDARD: ${{ vars.OCTG_PREVIEW_QUOTA_LIMIT_STANDARD }}
          PREVIEW_QUOTA_LIMIT_MINI: ${{ vars.OCTG_PREVIEW_QUOTA_LIMIT_MINI }}
          PREVIEW_WORKER_NAME: ${{ vars.OCTG_PREVIEW_WORKER_NAME || 'octg-gateway-preview' }}
          PREVIEW_CONFIG_PATH: ${{ runner.temp }}/wrangler-preview.jsonc
        run: |
          set -euo pipefail
          if [ -z "$PREVIEW_DATABASE_ID" ] || [ -z "$PREVIEW_BASE_URL" ] || [ -z "$PREVIEW_UPSTREAM_BASE_URL" ] || [ -z "$PREVIEW_QUOTA_LIMIT_STANDARD" ] || [ -z "$PREVIEW_QUOTA_LIMIT_MINI" ]; then
            echo "::error::Preview database, Worker URL, upstream, and quota-limit variables must be configured"
            exit 2
          fi
          if [[ ! "$PREVIEW_QUOTA_LIMIT_STANDARD" =~ ^(0|[1-9][0-9]*)$ ]] || [[ ! "$PREVIEW_QUOTA_LIMIT_MINI" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Preview STANDARD quota must be a non-negative integer and MINI quota must be a positive integer"
            exit 2
          fi
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          import * as ts from "typescript";
          import { assertPreviewQuotaAllocation } from "./scripts/preview-quota-validator.mjs";

          const projectRoot = process.cwd();
          const source = await readFile("apps/gateway-worker/wrangler.jsonc", "utf8");
          const parsed = ts.parseConfigFileTextToJson("wrangler.jsonc", source);
          if (parsed.error) {
            throw new Error(ts.flattenDiagnosticMessageText(parsed.error.messageText, "\n"));
          }
          const config = parsed.config;
          const productionDatabase = Array.isArray(config.d1_databases)
            ? config.d1_databases.find((entry) => entry.binding === "DB")
            : undefined;
          if (!productionDatabase) {
            throw new Error("Expected a DB D1 binding in wrangler.jsonc");
          }
          assertPreviewQuotaAllocation({
            production: {
              STANDARD: Number(config.vars?.QUOTA_LIMIT_STANDARD),
              MINI: Number(config.vars?.QUOTA_LIMIT_MINI),
            },
            preview: {
              STANDARD: Number(process.env.PREVIEW_QUOTA_LIMIT_STANDARD),
              MINI: Number(process.env.PREVIEW_QUOTA_LIMIT_MINI),
            },
          });
          config.name = process.env.PREVIEW_WORKER_NAME;
          config.main = `${projectRoot}/apps/gateway-worker/src/index.ts`;
          config.assets.directory = `${projectRoot}/apps/gateway-worker/public`;
          config.d1_databases = [{
            ...productionDatabase,
            binding: "DB",
            database_id: process.env.PREVIEW_DATABASE_ID,
            database_name: `${process.env.PREVIEW_WORKER_NAME}-db`,
            migrations_dir: `${projectRoot}/db/migrations`,
            remote: true,
          }];
          config.vars.QUOTA_LIMIT_STANDARD = process.env.PREVIEW_QUOTA_LIMIT_STANDARD;
          config.vars.QUOTA_LIMIT_MINI = process.env.PREVIEW_QUOTA_LIMIT_MINI;
          config.vars.OCTG_UPSTREAM_BASE_URL = process.env.PREVIEW_UPSTREAM_BASE_URL;
          await writeFile(process.env.PREVIEW_CONFIG_PATH, `${JSON.stringify(config, null, 2)}\n`, { mode: 0o600 });
          NODE
          echo "config=$PREVIEW_CONFIG_PATH" >> "$GITHUB_OUTPUT"

      - name: Apply preview D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          PREVIEW_CONFIG: ${{ steps.preview-config.outputs.config }}
        run: |
          ./node_modules/.bin/wrangler d1 migrations apply DB \
            --remote \
            --config "$PREVIEW_CONFIG"

      - name: Capture current 100% deployment
        id: current
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          PREVIEW_CONFIG: ${{ steps.preview-config.outputs.config }}
        run: |
          set -euo pipefail
          current_file="$RUNNER_TEMP/current-deployment.json"
          ./node_modules/.bin/wrangler deployments status \
            --config "$PREVIEW_CONFIG" \
            --json > "$current_file"
          current_version_id=$(jq -r '
            [.versions[] | select(.percentage == 100) | .version_id]
            | if length == 1 then .[0] else empty end
          ' "$current_file")
          if [ -z "$current_version_id" ]; then
            echo "::error::Current deployment is not a single 100% version; refusing to change traffic"
            exit 1
          fi
          echo "version_id=$current_version_id" >> "$GITHUB_OUTPUT"

      - name: Upload worker version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          OCTG_KEY_PEPPER: ${{ secrets.OCTG_KEY_PEPPER }}
          OCTG_UPSTREAM_API_TOKEN: ${{ secrets.OCTG_UPSTREAM_API_TOKEN }}
          PREVIEW_CONFIG: ${{ steps.preview-config.outputs.config }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "$OCTG_KEY_PEPPER" ] || [ -z "$OCTG_UPSTREAM_API_TOKEN" ]; then
            echo "::error::Preview Worker secrets are not configured"
            exit 2
          fi
          secrets_file="$RUNNER_TEMP/preview-secrets.json"
          cleanup_secrets() {
            node -e 'require("node:fs").rmSync(process.argv[1], { force: true })' "$secrets_file"
          }
          trap cleanup_secrets EXIT
          node --input-type=module - "$secrets_file" <<'NODE'
          import { writeFile } from "node:fs/promises";

          await writeFile(
            process.argv[2],
            `${JSON.stringify({
              OCTG_KEY_PEPPER: process.env.OCTG_KEY_PEPPER,
              OCTG_UPSTREAM_API_TOKEN: process.env.OCTG_UPSTREAM_API_TOKEN,
            })}\n`,
            { mode: 0o600 },
          );
          NODE
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"
          ./node_modules/.bin/wrangler versions upload \
            --config "$PREVIEW_CONFIG" \
            --secrets-file "$secrets_file" \
            --tag "pr-${PULL_REQUEST_NUMBER}" \
            --message "pr-${PULL_REQUEST_NUMBER} ${PULL_REQUEST_HEAD_SHA}"
          version_id=$(jq -s -r '
            [.[] | select(.type == "version-upload") | .version_id // empty]
            | last // empty
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$version_id" ]; then
            echo "::error::Worker Version ID not found in Wrangler output"
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"

      - name: Add uploaded version at 0% traffic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          PREVIEW_CONFIG: ${{ steps.preview-config.outputs.config }}
          CURRENT_VERSION_ID: ${{ steps.current.outputs.version_id }}
          NEW_VERSION_ID: ${{ steps.upload.outputs.version_id }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ./node_modules/.bin/wrangler versions deploy \
            "${NEW_VERSION_ID}@0%" "${CURRENT_VERSION_ID}@100%" \
            --config "$PREVIEW_CONFIG" \
            --message "PR ${PULL_REQUEST_NUMBER} smoke test" \
            --yes

      - name: Run smoke test with Version Override
        id: smoke
        continue-on-error: true
        env:
          OCTG_SMOKE_API_KEY: ${{ secrets.OCTG_PREVIEW_SMOKE_API_KEY }}
          OCTG_VERSION_OVERRIDE: ${{ steps.upload.outputs.version_id }}
          OCTG_VERSION_OVERRIDE_WORKER_NAME: ${{ vars.OCTG_PREVIEW_WORKER_NAME || 'octg-gateway-preview' }}
          SMOKE_BASE_URL: ${{ vars.OCTG_PREVIEW_BASE_URL }}
          SMOKE_MODEL: ${{ vars.SMOKE_MODEL || 'gpt-5-mini' }}
        run: |
          if [ -z "$SMOKE_BASE_URL" ]; then
            echo "::error::Repository variable OCTG_PREVIEW_BASE_URL is not set"
            exit 2
          fi
          bash scripts/ci-smoke-test.sh "$SMOKE_BASE_URL" "$SMOKE_MODEL"

      - name: Restore current version at 100% traffic
        if: always() && steps.current.outputs.version_id != '' && steps.upload.outputs.version_id != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
          PREVIEW_CONFIG: ${{ steps.preview-config.outputs.config }}
          CURRENT_VERSION_ID: ${{ steps.current.outputs.version_id }}
        run: |
          ./node_modules/.bin/wrangler rollback \
            "$CURRENT_VERSION_ID" \
            --config "$PREVIEW_CONFIG" \
            --message "Restore current version after PR smoke test" \
            --yes

      - name: Fail when smoke test failed
        if: steps.smoke.outcome != 'success'
        run: exit 1

  version-smoke-fork:
    needs: test
    if: ${{ github.event.pull_request.head.repo.fork == true }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Secret-free fork validation
        run: |
          set -euo pipefail
          echo "Fork pull request detected; preview deployment skipped because pull_request workflows do not receive preview credentials."
