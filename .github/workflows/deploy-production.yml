name: Deploy Production

on:
  workflow_run:
    workflows: [Deploy Deno Tokenizer]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: octg-deployment
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: deno-production
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
          cache: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Smoke script contract test
        run: npm run test:ci-smoke

      - name: Validate Production Deno tokenizer configuration
        run: |
          set -euo pipefail
          node scripts/production-deno-config.mjs
        env:
          MAX_INPUT_BYTES: ${{ vars.MAX_INPUT_BYTES }}
          DENO_TOKENIZER_ENDPOINT: ${{ vars.DENO_TOKENIZER_ENDPOINT }}
          DENO_TOKENIZER_THRESHOLD_BYTES: ${{ vars.DENO_TOKENIZER_THRESHOLD_BYTES }}
          DENO_TOKENIZER_TIMEOUT_MS: ${{ vars.DENO_TOKENIZER_TIMEOUT_MS }}
          DENO_PREPARE_ENDPOINT: ${{ vars.DENO_PREPARE_ENDPOINT }}
          DENO_PREPARE_THRESHOLD_BYTES: ${{ vars.DENO_PREPARE_THRESHOLD_BYTES }}

      - name: Validate Production Deno tokenizer authentication Secret
        env:
          PRODUCTION_DENO_TOKENIZER_AUTH_TOKEN: ${{ secrets.PRODUCTION_DENO_TOKENIZER_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$PRODUCTION_DENO_TOKENIZER_AUTH_TOKEN" ]]; then
            echo "::error::PRODUCTION_DENO_TOKENIZER_AUTH_TOKEN is not configured"
            exit 2
          fi

      - name: Verify Deno prepare contract
        env:
          DENO_PREPARE_ENDPOINT: ${{ vars.DENO_PREPARE_ENDPOINT }}
          DENO_TOKENIZER_AUTH_TOKEN: ${{ secrets.PRODUCTION_DENO_TOKENIZER_AUTH_TOKEN }}
          MAX_INPUT_BYTES: ${{ vars.MAX_INPUT_BYTES }}
        run: node scripts/verify-deno-prepare-contract.mjs

      - name: Require master alignment with the Deno revision
        id: master_alignment
        env:
          DENO_WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          remote_master_sha="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          if [[ -z "$remote_master_sha" ]]; then
            echo "::error::remote refs/heads/master could not be resolved"
            exit 1
          fi
          if [[ "$remote_master_sha" != "$DENO_WORKFLOW_SHA" ]]; then
            echo "::notice::Worker deployment skipped: remote master advanced past the Deno workflow revision"
            echo "aligned=false" >> "$GITHUB_OUTPUT"
          else
            echo "aligned=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.master_alignment.outputs.aligned == 'true'
        run: ./node_modules/.bin/wrangler d1 migrations apply octg --remote --config apps/gateway-worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        if: steps.master_alignment.outputs.aligned == 'true'
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/production-worker-secrets.json"
          trap 'node -e '\''require("node:fs").rmSync(process.argv[1], { force: true })'\'' "$secrets_file"' EXIT
          node - "$secrets_file" <<'NODE'
          const fs = require("node:fs");
          const token = process.env.PRODUCTION_DENO_TOKENIZER_AUTH_TOKEN;
          if (!token) throw new Error("Production tokenizer authentication Secret is not configured");
          fs.writeFileSync(
            process.argv[2],
            `${JSON.stringify({ DENO_TOKENIZER_AUTH_TOKEN: token })}\n`,
            { mode: 0o600 },
          );
          NODE
          node -e 'require("node:fs").rmSync(process.argv[1], { force: true })' "$WRANGLER_OUTPUT_FILE_PATH"
          ./node_modules/.bin/wrangler versions upload \
            --config apps/gateway-worker/wrangler.jsonc \
            --keep-vars \
            --secrets-file "$secrets_file" \
            --var "MAX_INPUT_BYTES:${MAX_INPUT_BYTES}" \
            --var "DENO_TOKENIZER_ENDPOINT:${DENO_TOKENIZER_ENDPOINT}" \
            --var "DENO_TOKENIZER_THRESHOLD_BYTES:${DENO_TOKENIZER_THRESHOLD_BYTES}" \
            --var "DENO_TOKENIZER_TIMEOUT_MS:${DENO_TOKENIZER_TIMEOUT_MS}" \
            --var "DENO_PREPARE_ENDPOINT:${DENO_PREPARE_ENDPOINT}" \
            --var "DENO_PREPARE_THRESHOLD_BYTES:${DENO_PREPARE_THRESHOLD_BYTES}"
          version_id=$(jq -s -r '
            [.[] | select(.type == "version-upload") | .version_id // empty]
            | last // empty
          ' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$version_id" ]; then
            echo "::error::Production Worker Version ID not found in Wrangler output"
            exit 1
          fi
          ./node_modules/.bin/wrangler versions deploy \
            "${version_id}@100%" \
            --config apps/gateway-worker/wrangler.jsonc \
            --message "Production Worker deployment" \
            --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_DENO_TOKENIZER_AUTH_TOKEN: ${{ secrets.PRODUCTION_DENO_TOKENIZER_AUTH_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/production-wrangler-output.ndjson
          MAX_INPUT_BYTES: ${{ vars.MAX_INPUT_BYTES }}
          DENO_TOKENIZER_ENDPOINT: ${{ vars.DENO_TOKENIZER_ENDPOINT }}
          DENO_TOKENIZER_THRESHOLD_BYTES: ${{ vars.DENO_TOKENIZER_THRESHOLD_BYTES }}
          DENO_TOKENIZER_TIMEOUT_MS: ${{ vars.DENO_TOKENIZER_TIMEOUT_MS }}
          DENO_PREPARE_ENDPOINT: ${{ vars.DENO_PREPARE_ENDPOINT }}
          DENO_PREPARE_THRESHOLD_BYTES: ${{ vars.DENO_PREPARE_THRESHOLD_BYTES }}
